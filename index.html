<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toucano Beans</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brandorange: '#FF5722',
                    }
                }
            }
        }
    </script>

    <!-- FontAwesome Icons CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="bg-[#e2e2e2] text-slate-900 font-sans min-h-screen flex flex-col justify-between relative">

<body class="bg-amber-50/30 text-slate-900 font-sans min-h-screen relative pb-16">



    <!-- Top Navigation Controls -->
    <div class="fixed top-6 left-6 right-6 z-30 flex items-center justify-between pointer-events-none">
        
        <!-- Top Left: Cart Button -->
        <button onclick="showCart()" class="pointer-events-auto relative p-3 bg-white/90 backdrop-blur shadow-md rounded-xl text-slate-800 hover:text-brandorange transition focus:outline-none border border-slate-300">
            <i class="fa-solid fa-cart-shopping text-xl"></i>
            <span id="cart-count" class="absolute -top-2 -right-2 bg-brandorange text-white text-xs font-bold w-5 h-5 rounded-full flex items-center justify-center">0</span>

    <!-- Top Action Bar (Cart Top-Left, Three-Dash Menu Top-Right) -->
    <div class="fixed top-6 left-6 right-6 z-30 flex items-center justify-between pointer-events-none">
        
        <!-- Top Left: Shopping Cart Icon -->
        <button onclick="showCart()" class="pointer-events-auto relative p-3 bg-white/90 backdrop-blur shadow-md rounded-full text-slate-800 hover:text-brandorange transition focus:outline-none">
            <i class="fa-solid fa-cart-shopping text-lg"></i>
            <span id="cart-count" class="absolute -top-1 -right-1 bg-brandorange text-white text-xs font-bold w-5 h-5 rounded-full flex items-center justify-center">0</span>

        </button>


        <!-- Top Right: Menu Button -->
        <button id="menu-btn" onclick="toggleMenu()" class="pointer-events-auto p-3 bg-white/90 backdrop-blur shadow-md rounded-xl text-slate-800 hover:text-brandorange transition focus:outline-none border border-slate-300">
            <i class="fa-solid fa-bars text-xl"></i>

        <!-- Top Right: Three-Dash Menu Icon -->
        <button id="menu-btn" onclick="toggleMenu()" class="pointer-events-auto p-3 bg-white/90 backdrop-blur shadow-md rounded-full text-slate-800 hover:text-brandorange transition focus:outline-none">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
            </svg>

        </button>
    </div>


    <!-- Slide-out Navigation Drawer -->
    <div id="side-drawer" class="fixed inset-y-0 right-0 w-64 bg-white shadow-2xl z-40 transform translate-x-full transition-transform duration-300 ease-in-out">
        <div class="p-6 flex flex-col h-full justify-between">
            <div>
                <div class="flex items-center justify-between mb-8">
                    <h2 class="text-xl font-bold text-slate-800">Menu</h2>
                    <button onclick="toggleMenu()" class="text-slate-500 hover:text-slate-800">
                        <i class="fa-solid fa-xmark text-xl"></i>
                    </button>
                </div>
                <nav class="space-y-4">
                    <a href="#" onclick="showHome(); toggleMenu();" class="block text-slate-700 hover:text-brandorange font-medium">Home</a>
                    <a href="#" onclick="filterCategory('coffee-beans'); toggleMenu();" class="block text-slate-700 hover:text-brandorange font-medium">Coffee Beans</a>
                    <a href="#" onclick="filterCategory('drip-coffee'); toggleMenu();" class="block text-slate-700 hover:text-brandorange font-medium">Drip Coffee</a>
                    <a href="#" onclick="filterCategory('essentials'); toggleMenu();" class="block text-slate-700 hover:text-brandorange font-medium">Coffee Essentials</a>
                </nav>
            </div>
            
            <div class="border-t pt-4">
                <button id="auth-btn" onclick="openAuthModal()" class="w-full py-2 px-4 bg-brandorange text-white font-semibold rounded-lg shadow hover:bg-orange-600 transition">
                    Sign In / Sign Up
                </button>
            </div>
        </div>
    </div>

    <!-- Overlay backdrop for Drawer -->
    <div id="drawer-overlay" onclick="toggleMenu()" class="fixed inset-0 bg-black/40 z-30 hidden"></div>

    <!-- Main Content Area -->
    <main class="flex-grow flex flex-col items-center justify-center px-4 pt-24 pb-12">
        
        <!-- Large Centered Branding -->
        <div class="text-center mb-16 cursor-pointer" onclick="showHome()">
            <img src="public/assets/logo.png" alt="Toucano Beans Logo" class="h-44 sm:h-52 mx-auto mb-4 object-contain">
            <h1 class="text-3xl sm:text-4xl font-extrabold tracking-wider text-slate-900 uppercase">TOUCANO BEANS</h1>
        </div>

        <!-- Three Category Cards Row -->
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-8 sm:gap-16 w-full max-w-3xl px-4 text-center">
            
            <!-- Category 1: Coffee Beans -->
            <button onclick="filterCategory('coffee-beans')" class="group flex flex-col items-center justify-center transition transform hover:-translate-y-1">
                <div class="text-4xl sm:text-5xl mb-3 text-slate-800 group-hover:text-brandorange transition">
                    <i class="fa-solid fa-wheat-awn"></i>
                </div>
                <span class="text-lg font-bold text-slate-800 group-hover:text-brandorange transition">Coffee Beans</span>
            </button>

            <!-- Category 2: Drip Coffee -->
            <button onclick="filterCategory('drip-coffee')" class="group flex flex-col items-center justify-center transition transform hover:-translate-y-1">
                <div class="text-4xl sm:text-5xl mb-3 text-slate-800 group-hover:text-brandorange transition">
                    <i class="fa-solid fa-droplet"></i>

    <!-- Slide-out Navigation Drawer -->
    <div id="side-drawer" class="fixed inset-y-0 right-0 w-64 bg-white shadow-2xl z-40 transform translate-x-full transition-transform duration-300 ease-in-out">
        <div class="p-6 flex flex-col h-full justify-between">
            <div>
                <div class="flex items-center justify-between mb-8">
                    <h2 class="text-xl font-bold text-slate-800">Menu</h2>
                    <button onclick="toggleMenu()" class="text-slate-500 hover:text-slate-800">
                        <i class="fa-solid fa-xmark text-xl"></i>
                    </button>

                </div>

                <span class="text-lg font-bold text-slate-800 group-hover:text-brandorange transition">Drip Coffee</span>
            </button>

            <!-- Category 3: Coffee Essentials -->
            <button onclick="filterCategory('essentials')" class="group flex flex-col items-center justify-center transition transform hover:-translate-y-1">
                <div class="text-4xl sm:text-5xl mb-3 text-slate-800 group-hover:text-brandorange transition">
                    <i class="fa-solid fa-mug-hot"></i>
                </div>
                <span class="text-lg font-bold text-slate-800 group-hover:text-brandorange transition">Coffee Essentials</span>
            </button>

                <nav class="space-y-4">
                    <a href="#" onclick="showHome(); toggleMenu();" class="block text-slate-700 hover:text-brandorange font-medium">Home</a>
                    <a href="#" onclick="filterCategory('coffee-beans'); toggleMenu();" class="block text-slate-700 hover:text-brandorange font-medium">Coffee Beans</a>
                    <a href="#" onclick="filterCategory('drip-coffee'); toggleMenu();" class="block text-slate-700 hover:text-brandorange font-medium">Drip Coffee</a>
                    <a href="#" onclick="filterCategory('essentials'); toggleMenu();" class="block text-slate-700 hover:text-brandorange font-medium">Essentials</a>
                </nav>
            </div>
            
            <div class="border-t pt-4">
                <button id="auth-btn" onclick="openAuthModal()" class="w-full py-2 px-4 bg-brandorange text-white font-semibold rounded-lg shadow hover:bg-orange-600 transition">
                    Sign In / Sign Up
                </button>
            </div>
        </div>
    </div>

    <!-- Overlay backdrop for Drawer -->
    <div id="drawer-overlay" onclick="toggleMenu()" class="fixed inset-0 bg-black/40 z-30 hidden"></div>

    <!-- Main Header / Branding -->
    <header class="pt-20 pb-6 text-center">
        <div class="cursor-pointer inline-block" onclick="showHome()">
            <img src="public/assets/logo.png" alt="Toucano Beans Logo" class="h-16 mx-auto mb-2 object-contain">
            <h1 class="text-2xl font-extrabold tracking-wide text-slate-800">TOUCANO BEANS</h1>
        </div>
    </header>

    <!-- Product Display Section -->
    <main class="max-w-4xl mx-auto px-4">
        <!-- Category Filter Tabs -->
        <div class="flex justify-center space-x-2 mb-8 overflow-x-auto py-2">
            <button onclick="filterCategory('all')" class="cat-btn px-4 py-2 rounded-full text-sm font-medium bg-brandorange text-white shadow">All Products</button>
            <button onclick="filterCategory('coffee-beans')" class="cat-btn px-4 py-2 rounded-full text-sm font-medium bg-white text-slate-600 hover:bg-amber-100 shadow-sm">Coffee Beans</button>
            <button onclick="filterCategory('drip-coffee')" class="cat-btn px-4 py-2 rounded-full text-sm font-medium bg-white text-slate-600 hover:bg-amber-100 shadow-sm">Drip Coffee</button>
            <button onclick="filterCategory('essentials')" class="cat-btn px-4 py-2 rounded-full text-sm font-medium bg-white text-slate-600 hover:bg-amber-100 shadow-sm">Essentials</button>
 
        </div>

        <!-- Dynamic Product Container (Populated via JS when category clicked) -->
        <div id="product-grid" class="w-full max-w-5xl mt-12 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>

        <!-- Dynamic Product Grid -->
        <div id="product-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Products will render dynamically via JS -->
        </div>
 
    </main>

    <!-- Footer -->
    <footer class="text-center py-4 text-xs text-slate-500 border-t border-slate-300">
        © 2026 Toucano Beans. All rights reserved.
    </footer>

    <!-- Auth Modal -->
    <div id="auth-modal" class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center hidden">
        <div class="bg-white rounded-xl shadow-2xl p-6 w-full max-w-md relative">
            <button onclick="closeAuthModal()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600">
                <i class="fa-solid fa-xmark text-lg"></i>

    <!-- Auth Modal (Sign In / Sign Up) -->
    <div id="auth-modal" class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center hidden">
        <div class="bg-white rounded-xl shadow-2xl p-6 w-full max-w-md relative">
            <button onclick="closeAuthModal()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600">
                <i class="fa-solid fa-xmark text-lg"></i>

            </button>
            <h3 id="modal-title" class="text-2xl font-bold mb-4 text-slate-800 text-center">Sign In</h3>
            
            <form id="auth-form" onsubmit="handleAuthSubmit(event)" class="space-y-4">
                <div id="name-field" class="hidden">
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Full Name</label>
                    <input type="text" id="auth-name" class="w-full border rounded-lg px-3 py-2 text-slate-800 focus:outline-none focus:border-brandorange">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Email</label>
                    <input type="email" id="auth-email" required class="w-full border rounded-lg px-3 py-2 text-slate-800 focus:outline-none focus:border-brandorange">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Password</label>
                    <input type="password" id="auth-password" required class="w-full border rounded-lg px-3 py-2 text-slate-800 focus:outline-none focus:border-brandorange">
                </div>
                <button type="submit" id="auth-submit-btn" class="w-full bg-brandorange text-white py-2 rounded-lg font-bold hover:bg-orange-600 transition">Sign In</button>
            </form>

            <p class="text-sm text-center text-slate-600 mt-4">
                <span id="toggle-auth-text">Don't have an account?</span>
                <button onclick="toggleAuthMode()" id="toggle-auth-btn" class="text-brandorange font-semibold ml-1 underline">Sign Up</button>
            </p>
        </div>
    </div>

    <!-- Application JavaScript Entry Point -->
    <script type="module" src="public/assets/js/main.js"></script>
</body>
</html>
