<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toucano Beans</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brandorange: '#FF5722',
                    }
                }
            }
        }
    </script>

    <!-- Application JavaScript Entry Point (Loads custom functions) -->
    <script type="module" src="public/assets/js/main.js"></script>

</head>
<body class="bg-[#fdf0de] text-slate-900 font-sans min-h-screen flex flex-col justify-between relative">

    <!-- Top Navigation Controls -->
    <div class="fixed top-6 left-6 right-6 z-30 flex items-center justify-between pointer-events-none">
        
        <!-- Top Left: Cart Button (Frameless) -->
        <button onclick="showCart()" class="pointer-events-auto relative p-3 text-slate-800 hover:text-brandorange transition focus:outline-none">
            <!-- Frameless SVG Cart Icon -->
            <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"></path>
            </svg>
            <span id="cart-count" class="absolute -top-1 -right-1 bg-brandorange text-white text-xs font-bold w-5 h-5 rounded-full flex items-center justify-center">0</span>
        </button>

        <!-- Top Right: Menu Button (Frameless) -->
        <button id="menu-btn" onclick="toggleMenu()" class="pointer-events-auto p-3 text-slate-800 hover:text-brandorange transition focus:outline-none">
            <!-- Frameless SVG Three-Dash Menu Icon -->
            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
            </svg>
        </button>
    </div>

    <!-- Slide-out Navigation Drawer -->
    <div id="side-drawer" class="fixed inset-y-0 right-0 w-64 bg-white shadow-2xl z-40 transform translate-x-full transition-transform duration-300 ease-in-out">
        <div class="p-6 flex flex-col h-full justify-between">
            <div>
                <div class="flex items-center justify-between mb-8">
                    <h2 class="text-xl font-bold text-slate-800">Menu</h2>
                    <button onclick="toggleMenu()" class="text-slate-500 hover:text-slate-800 focus:outline-none">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                        </svg>
                    </button>
                </div>
                <nav class="space-y-4">
                    <a href="javascript:void(0);" onclick="showHome(); toggleMenu();" class="block text-slate-700 hover:text-brandorange font-medium">Home</a>
                    <a href="javascript:void(0);" onclick="filterCategory('coffee-beans'); toggleMenu();" class="block text-slate-700 hover:text-brandorange font-medium">Coffee Beans</a>
                    <a href="javascript:void(0);" onclick="filterCategory('drip-coffee'); toggleMenu();" class="block text-slate-700 hover:text-brandorange font-medium">Drip Coffee</a>
                    <a href="javascript:void(0);" onclick="filterCategory('essentials'); toggleMenu();" class="block text-slate-700 hover:text-brandorange font-medium">Coffee Essentials</a>
                </nav>
            </div>
            
            <div class="border-t pt-4">
                <button id="auth-btn" onclick="openAuthModal()" class="w-full py-2 px-4 bg-brandorange text-white font-semibold rounded-lg shadow hover:bg-orange-600 transition focus:outline-none">
                    Sign In / Sign Up
                </button>
            </div>
        </div>
    </div>

    <!-- Overlay backdrop for Drawer -->
    <div id="drawer-overlay" onclick="toggleMenu()" class="fixed inset-0 bg-black/40 z-30 hidden"></div>

    <!-- Main Content Area -->
    <main class="flex-grow flex flex-col items-center justify-center px-4 pt-28 pb-12">
        
        <!-- Large Centered Branding -->
        <div class="text-center mb-16 cursor-pointer" onclick="showHome()">
            <img src="public/assets/logo.png" alt="Toucano Beans Logo" class="h-44 sm:h-52 mx-auto mb-4 object-contain">
            <h1 class="text-3xl sm:text-4xl font-extrabold tracking-wider text-slate-900 uppercase">TOUCANO BEANS</h1>
        </div>
<!-- Three Category Cards Row -->
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-8 sm:gap-16 w-full max-w-3xl px-4 text-center">
            
            <!-- Category 1: Coffee Beans (Three Beans in Triangle) -->
            <a href="javascript:void(0);" onclick="filterCategory('coffee-beans')" class="group flex flex-col items-center justify-center transition transform hover:-translate-y-1">
                <div class="mb-3 text-slate-800 group-hover:text-brandorange transition flex items-center justify-center">
                    <svg width="56" height="56" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                        <!-- Top Bean -->
                        <path d="M12 2C9.5 2 7.5 4 7.5 6.5C7.5 8.5 9 10.2 11 10.8V11H13V10.8C15 10.2 16.5 8.5 16.5 6.5C16.5 4 14.5 2 12 2ZM11.5 4.2C11.8 5.6 12 7.1 11.8 8.6C11.8 8.7 11.7 8.8 11.6 8.8C11.5 8.8 11.4 8.7 11.4 8.6C11.2 7.1 11 5.6 11.5 4.2Z"/>
                        <!-- Bottom Left Bean -->
                        <path d="M6.5 13C4 13 2 15 2 17.5C2 19.5 3.5 21.2 5.5 21.8V22H7.5V21.8C9.5 21.2 11 19.5 11 17.5C11 15 9 13 6.5 13ZM6 15.2C6.3 16.6 6.5 18.1 6.3 19.6C6.3 19.7 6.2 19.8 6.1 19.8C6 19.8 5.9 19.7 5.9 19.6C5.7 18.1 5.5 16.6 6 15.2Z"/>
                        <!-- Bottom Right Bean -->
                        <path d="M17.5 13C15 13 13 15 13 17.5C13 19.5 14.5 21.2 16.5 21.8V22H18.5V21.8C20.5 21.2 22 19.5 22 17.5C22 15 20 13 17.5 13ZM17 15.2C17.3 16.6 17.5 18.1 17.3 19.6C17.3 19.7 17.2 19.8 17.1 19.8C17 19.8 16.9 19.7 16.9 19.6C16.7 18.1 16.5 16.6 17 15.2Z"/>
                    </svg>
                </div>
                <span class="text-lg font-bold text-slate-800 group-hover:text-brandorange transition">Coffee Beans</span>
            </a>

            <!-- Category 2: Drip Coffee (Single Droplet) -->
            <a href="javascript:void(0);" onclick="filterCategory('drip-coffee')" class="group flex flex-col items-center justify-center transition transform hover:-translate-y-1">
                <div class="mb-3 text-slate-800 group-hover:text-brandorange transition flex items-center justify-center">
                    <svg width="56" height="56" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/>
                    </svg>
                </div>
                <span class="text-lg font-bold text-slate-800 group-hover:text-brandorange transition">Drip Coffee</span>
            </a>

<!-- Three Category Cards Row -->
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-8 sm:gap-16 w-full max-w-3xl px-4 text-center">
            
            <!-- Category 1: Coffee Beans (Three Beans in Triangle) -->
            <a href="javascript:void(0);" onclick="filterCategory('coffee-beans')" class="group flex flex-col items-center justify-center transition transform hover:-translate-y-1">
                <div class="mb-3 text-slate-800 group-hover:text-brandorange transition flex items-center justify-center">
                    <svg width="56" height="56" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                        <!-- Top Bean -->
                        <path d="M12 2C9.5 2 7.5 4 7.5 6.5C7.5 8.5 9 10.2 11 10.8V11H13V10.8C15 10.2 16.5 8.5 16.5 6.5C16.5 4 14.5 2 12 2ZM11.5 4.2C11.8 5.6 12 7.1 11.8 8.6C11.8 8.7 11.7 8.8 11.6 8.8C11.5 8.8 11.4 8.7 11.4 8.6C11.2 7.1 11 5.6 11.5 4.2Z"/>
                        <!-- Bottom Left Bean -->
                        <path d="M6.5 13C4 13 2 15 2 17.5C2 19.5 3.5 21.2 5.5 21.8V22H7.5V21.8C9.5 21.2 11 19.5 11 17.5C11 15 9 13 6.5 13ZM6 15.2C6.3 16.6 6.5 18.1 6.3 19.6C6.3 19.7 6.2 19.8 6.1 19.8C6 19.8 5.9 19.7 5.9 19.6C5.7 18.1 5.5 16.6 6 15.2Z"/>
                        <!-- Bottom Right Bean -->
                        <path d="M17.5 13C15 13 13 15 13 17.5C13 19.5 14.5 21.2 16.5 21.8V22H18.5V21.8C20.5 21.2 22 19.5 22 17.5C22 15 20 13 17.5 13ZM17 15.2C17.3 16.6 17.5 18.1 17.3 19.6C17.3 19.7 17.2 19.8 17.1 19.8C17 19.8 16.9 19.7 16.9 19.6C16.7 18.1 16.5 16.6 17 15.2Z"/>
                    </svg>
                </div>
                <span class="text-lg font-bold text-slate-800 group-hover:text-brandorange transition">Coffee Beans</span>
            </a>

            <!-- Category 2: Drip Coffee (Single Droplet) -->
            <a href="javascript:void(0);" onclick="filterCategory('drip-coffee')" class="group flex flex-col items-center justify-center transition transform hover:-translate-y-1">
                <div class="mb-3 text-slate-800 group-hover:text-brandorange transition flex items-center justify-center">
                    <svg width="56" height="56" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/>
                    </svg>
                </div>
                <span class="text-lg font-bold text-slate-800 group-hover:text-brandorange transition">Drip Coffee</span>
            </a>

            <!-- Category 3: Coffee Essentials (Coffee Mug) -->
            <a href="javascript:void(0);" onclick="filterCategory('essentials')" class="group flex flex-col items-center justify-center transition transform hover:-translate-y-1">
                <div class="mb-3 text-slate-800 group-hover:text-brandorange transition flex items-center justify-center">
                    <svg width="56" height="56" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                        <path d="M2 19h18v2H2v-2zm18-14h-2V3a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v12a4 4 0 0 0 4 4 h6a4 4 0 0 0 4-4v-2h2a3 3 0 0 0 3-3V8a3 3 0 0 0-3-3zm1 6a1 1 0 0 1-1 1h-2V7h2a1 1 0 0 1 1 1v3z"/>
                    </svg>
                </div>
                <span class="text-lg font-bold text-slate-800 group-hover:text-brandorange transition">Coffee Essentials</span>
            </a>
            
        </div>

        <!-- Dynamic Product Container (Populated via JS when category clicked) -->
        <div id="product-grid" class="w-full max-w-5xl mt-12 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    </main>

    <!-- Footer -->
    <footer class="text-center py-4 text-xs text-slate-500 border-t border-slate-300">
        © 2026 Toucano Beans. All rights reserved.
    </footer>

    <!-- Auth Modal -->
    <div id="auth-modal" class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center hidden">
        <div class="bg-white rounded-xl shadow-2xl p-6 w-full max-w-md relative">
            <button onclick="closeAuthModal()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600 focus:outline-none">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                </svg>
            </button>
            <h3 id="modal-title" class="text-2xl font-bold mb-4 text-slate-800 text-center">Sign In</h3>
            
            <form id="auth-form" onsubmit="handleAuthSubmit(event)" class="space-y-4">
                <div id="name-field" class="hidden">
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Full Name</label>
                    <input type="text" id="auth-name" class="w-full border rounded-lg px-3 py-2 text-slate-800 focus:outline-none focus:border-brandorange">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Email</label>
                    <input type="email" id="auth-email" required class="w-full border rounded-lg px-3 py-2 text-slate-800 focus:outline-none focus:border-brandorange">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Password</label>
                    <input type="password" id="auth-password" required class="w-full border rounded-lg px-3 py-2 text-slate-800 focus:outline-none focus:border-brandorange">
                </div>
                <button type="submit" id="auth-submit-btn" class="w-full bg-brandorange text-white py-2 rounded-lg font-bold hover:bg-orange-600 transition focus:outline-none">Sign In</button>
            </form>

            <p class="text-sm text-center text-slate-600 mt-4">
                <span id="toggle-auth-text">Don't have an account?</span>
                <button onclick="toggleAuthMode()" id="toggle-auth-btn" class="text-brandorange font-semibold ml-1 underline focus:outline-none">Sign Up</button>
            </p>
        </div>
    </div>

</body>
</html>
