<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر القهوة المختصة - رشفة</title>
    <!-- استيراد خط عربي جميل (Cairo) -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }
        body {
            background-color: #f9f6f0;
            color: #333;
        }
        /* الهيدر */
        header {
            background-color: #2c1d11;
            color: white;
            padding: 1rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: #d4a373;
        }
        .cart-btn {
            background-color: #d4a373;
            color: #2c1d11;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 5px;
            font-weight: 600;
            cursor: pointer;
        }
        /* قسم البانر الرئيسي */
        .hero {
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?auto=format&fit=crop&w=1200&q=80');
            background-size: cover;
            background-position: center;
            height: 400px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: white;
            padding: 0 1rem;
        }
        .hero h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
        }
        .hero p {
            font-size: 1.2rem;
            margin-bottom: 1.5rem;
        }
        .btn-main {
            background-color: #d4a373;
            color: #2c1d11;
            padding: 0.75rem 2rem;
            border-radius: 5px;
            text-decoration: none;
            font-weight: 700;
        }
        /* المنتجات */
        .container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1rem;
        }
        .section-title {
            text-align: center;
            margin-bottom: 2rem;
            color: #2c1d11;
            font-size: 2rem;
        }
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 2rem;
        }
        .product-card {
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            transition: transform 0.3s;
        }
        .product-card:hover {
            transform: translateY(-5px);
        }
        .product-img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }
        .product-info {
            padding: 1.5rem;
        }
        .product-title {
            font-size: 1.2rem;
            margin-bottom: 0.5rem;
            color: #2c1d11;
        }
        .product-price {
            color: #b08968;
            font-weight: 700;
            margin-bottom: 1rem;
            font-size: 1.1rem;
        }
        .add-to-cart {
            width: 100%;
            background-color: #2c1d11;
            color: white;
            border: none;
            padding: 0.5rem;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
        }
        .add-to-cart:hover {
            background-color: #d4a373;
            color: #2c1d11;
        }
        /* الفوتر */
        footer {
            background-color: #2c1d11;
            color: white;
            text-align: center;
            padding: 1.5rem;
            margin-top: 3rem;
        }
    </style>
</head>
<body>

    <!-- الهيدر -->
    <header>
        <div class="logo">☕ رشفة كوفي</div>
        <button class="cart-btn">سلة المشتريات (0)</button>
    </header>

    <!-- الواجهة الرئيسية -->
    <section class="hero">
        <h1>اجعل كل صباح مميزاً مع قهوتك المفضلة</h1>
        <p>أجود حبوب البن المختصة وأرقى أدوات التقطير بين يديك</p>
        <a href="#products" class="btn-main">تسوق المنتجات</a>
    </section>

    <!-- قسم المنتجات -->
    <div class="container" id="products">
        <h2 class="section-title">منتجاتنا المميزة</h2>
        
        <div class="products-grid">
            <!-- منتج 1: بن -->
            <div class="product-card">
                <img src="https://images.unsplash.com/photo-1559056199-641a0ac8b55e?auto=format&fit=crop&w=500&q=80" alt="بن إثيوبي" class="product-img">
                <div class="product-info">
                    <h3 class="product-title">محصول إثيوبي يirgacheffe</h3>
                    <p class="product-price">65 ر.س</p>
                    <button class="add-to-cart">أضف للسلة</button>
                </div>
            </div>

            <!-- منتج 2: أدوات -->
            <div class="product-card">
                <img src="https://images.unsplash.com/photo-1514432324607-a09d9b4aefdd?auto=format&fit=crop&w=500&q=80" alt="إبرام تقطير" class="product-img">
                <div class="product-info">
                    <h3 class="product-title">إبرام تقطير عنق الإوزة</h3>
                    <p class="product-price">120 ر.س</p>
                    <button class="add-to-cart">أضف للسلة</button>
                </div>
            </div>

            <!-- منتج 3: بن -->
            <div class="product-card">
                <img src="https://images.unsplash.com/photo-1587049352847-4a222e784d38?auto=format&fit=crop&w=500&q=80" alt="بن كولومبي" class="product-img">
                <div class="product-info">
                    <h3 class="product-title">محصول كولومبي مسار</h3>
                    <p class="product-price">58 ر.س</p>
                    <button class="add-to-cart">أضف للسلة</button>
                </div>
            </div>

            <!-- منتج 4: أدوات -->
            <div class="product-card">
                <img src="https://images.unsplash.com/photo-1544787219-7f47ccb76574?auto=format&fit=crop&w=500&q=80" alt="قمع V60" class="product-img">
                <div class="product-info">
                    <h3 class="product-title">قمع تقطير V60 زجاجي</h3>
                    <p class="product-price">45 ر.س</p>
                    <button class="add-to-cart">أضف للسلة</button>
                </div>
            </div>
        </div>
    </div>

    <!-- الفوتر -->
    <footer>
        <p>جميع الحقوق محفوظة لمتجر رشفة © 2026</p>
    </footer>

</body>
</html>
